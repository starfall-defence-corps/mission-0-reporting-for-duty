services:
  sdc-gate:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: sdc-gate
    hostname: sdc-gate
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./ssh-keys/authorized_keys:/home/cadet/.ssh/authorized_keys:ro
    networks:
      fleet_net:
        ipv4_address: 172.30.0.10
    ports:
      - "2221:22"

networks:
  fleet_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
